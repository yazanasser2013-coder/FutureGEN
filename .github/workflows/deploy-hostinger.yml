name: Update News JSON

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # كل 6 ساعات (UTC)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser beautifulsoup4 lxml requests tqdm
          pip install transformers torch sentencepiece sacremoses

      - name: Run scraper
        run: |
          python scripts/news_rss_stable_v2.py

      - name: Commit changes (if any)
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add site/data/news.json || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update news.json"
          git push


