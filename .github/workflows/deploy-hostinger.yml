name: Update News JSON

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser beautifulsoup4 lxml requests tqdm
          pip install transformers torch sentencepiece sacremoses

      - name: Run scraper
        run: |
          python scripts/news_rss_stable_v2.py

      - name: Debug output
        run: |
          ls -la site/data || true
          test -f site/data/news.json && echo "✅ news.json exists" || (echo "❌ news.json missing" && exit 1)

      - name: Commit changes (if any)
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add site/data/news.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update news.json"
          git push


