name: Update News JSON

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser beautifulsoup4 lxml requests tqdm
          pip install transformers torch sentencepiece sacremoses

      - name: Run scraper
        run: |
         mkdir -p site/data
         python scripts/news_rss_stable_v2.py

      - name: Locate and move news.json into site/data (fallback)
        run: |
         echo "Searching for news.json..."
         find . -maxdepth 5 -type f -name "news.json" -print

         if [ -f "site/data/news.json" ]; then
           echo "✅ news.json already in site/data"
         elif [ -f "scraped_data/news.json" ]; then
          mv "scraped_data/news.json" "site/data/news.json"
         echo "✅ moved from scraped_data -> site/data"
          elif [ -f "scrapers/news.json" ]; then
         mv "scrapers/news.json" "site/data/news.json"
          echo "✅ moved from scrapers -> site/data"
         else
           FILE=$(find . -maxdepth 5 -type f -name "news.json" | head -n 1)
         if [ -n "$FILE" ]; then
           mv "$FILE" "site/data/news.json"
           echo "✅ moved from $FILE -> site/data"
         else
           echo "❌ news.json not found anywhere"
           exit 1
         fi
         fi

      - name: Commit changes (if any)
        run: |
         git config user.name "news-bot"
         git config user.email "news-bot@users.noreply.github.com"
         git add site/data/news.json
         git add .
         git diff --cached --quiet && echo "No changes" && exit 0
         git commit -m "chore: update news.json"
         git push





