name: Update AI News + Deploy to Hostinger (FTP)


on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      - name: Install Node deps
        run: npm ci || npm install


      - name: Run scraper (Node)
        run: node scripts/scrape_ai_news.js


      - name: Debug - show generated files
        run: |
          ls -la scraped_data || true
          find . -maxdepth 6 -name "ai_news.json" -print || true


      - name: Debug - check secrets exist
        run: |
          if [ -z "${{ secrets.FTP_SERVER }}" ]; then echo "FTP_SERVER is EMPTY"; else echo "FTP_SERVER is SET"; fi
          if [ -z "${{ secrets.FTP_USERNAME }}" ]; then echo "FTP_USERNAME is EMPTY"; else echo "FTP_USERNAME is SET"; fi
          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then echo "FTP_PASSWORD is EMPTY"; else echo "FTP_PASSWORD is SET"; fi


      - name: Debug - export FTP env
        run: |
          echo "FTP_SERVER=${{ secrets.FTP_SERVER }}" >> $GITHUB_ENV
          echo "FTP_USERNAME=${{ secrets.FTP_USERNAME }}" >> $GITHUB_ENV
          echo "FTP_PASSWORD=${{ secrets.FTP_PASSWORD }}" >> $GITHUB_ENV

      - name: Deploy scraped_data to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          port: 21
          local-dir: scraped_data/
          server-dir: /



