name: Update AI News + Deploy to Hostinger (FTP)


on:
  schedule:
    - cron: "0 6 * * *"   # يوميًا 06:00 UTC = 09:00 الرياض
  workflow_dispatch:


permissions:
  contents: read


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Setuap Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      - name: Install Node deps
        run: |
          npm ci || npm install


      - name: Run scraper (Node)
        run: |
          node scripts/scrape_ai_news.js


      - name: Debug - show generated files
        run: |
          echo "PWD:" && pwd
          echo "List repo root:" && ls -la
          echo "List scraped_data:" && ls -la scraped_data || true
          echo "Find ai_news.json:" && find . -maxdepth 6 -name "ai_news.json" -print || true

      - name: Debug - check secrets exist
        run: |
          if [ -z "${{ secrets.FTP_SERVER }}" ]; then echo "FTP_SERVER is EMPTY"; else echo "FTP_SERVER is SET"; fi
          if [ -z "${{ secrets.FTP_USERNAME }}" ]; then echo "FTP_USERNAME is EMPTY"; else echo "FTP_USERNAME is SET"; fi
          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then echo "FTP_PASSWORD is EMPTY"; else echo "FTP_PASSWORD is SET"; fi


      - name: Deploy scraped_data to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
      - name: Deploy scraped_data to Hostinger (TEST ROOT)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./scraped_data/
          server-dir: /
